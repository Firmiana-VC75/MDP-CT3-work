<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERESTING - Aesthetic Categories</title>
    <link rel="stylesheet" href="InterestingStyle.css">
</head>
<body>
    <!-- Back button -->
    <a href="HomePage.html" class="back-btn">← Back</a>

    <!-- Stage 1: Topic Selection -->
    <div id="selection-screen" class="screen active">
        <div class="selection-container">
            <h1>What interests you today?</h1>
            <p class="subtitle">Choose one to explore</p>
            
            <div class="topic-buttons">
                <button class="topic-btn" data-topic="cats">
                    <span class="emoji">🐱</span>
                    <span class="label">Cats</span>
                </button>
                <button class="topic-btn" data-topic="art">
                    <span class="emoji">🎨</span>
                    <span class="label">Art</span>
                </button>
                <button class="topic-btn" data-topic="food">
                    <span class="emoji">🍕</span>
                    <span class="label">Food</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Stage 2: Feed Screen -->
    <div id="feed-screen" class="screen">
        <div class="feed-header">
            <h2>Your Feed</h2>
        </div>
        
        <div id="feed-container" class="feed-container">
            <!-- Feed items will be generated by JavaScript -->
        </div>
    </div>

    <!-- Stage 3: Reveal Screen -->
    <div id="reveal-screen" class="screen">
        <div class="reveal-container">
            <h1 class="reveal-title">PATTERN DETECTED</h1>
            
            <div class="stats-section">
                <div class="stat">
                    <div class="stat-label">Time spent</div>
                    <div class="stat-value" id="time-spent">0:00</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Posts viewed</div>
                    <div class="stat-value" id="posts-viewed">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Clicks on main topic</div>
                    <div class="stat-value" id="main-clicks">0</div>
                </div>
            </div>

            <div class="chart-section">
                <h3>Your attention allocation</h3>
                <div id="attention-chart" class="attention-chart">
                    <!-- Chart bars will be generated by JavaScript -->
                </div>
            </div>

            <button id="show-missed-btn" class="show-missed-btn">
                Show what I missed
            </button>
        </div>
    </div>

    <!-- Stage 4: Missed Content Screen -->
    <div id="missed-screen" class="screen">
        <div class="missed-container">
            <h1 class="missed-title">BURIED CONTENT</h1>
            
            <div id="buried-content" class="buried-content">
                <!-- Buried content will be generated by JavaScript -->
            </div>

            <div class="final-message">
                The algorithm decided.
            </div>

            <a href="index.html" class="return-btn">Return to homepage</a>
        </div>
    </div>

    <script src="InterestingScript.js"></script>
</body>
</html>
